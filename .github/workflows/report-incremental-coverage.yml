name: Report Incremental Coverage

# Runs when the CI workflow completes. This will run with full privileges,
# even if the other workflow doesn't. That allows us to leave PR comments,
# when we would not be able to do otherwise.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

jobs:
  report:
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest

    permissions:
      # "Write" to pull-requests to leave comments
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download coverage artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Get artifacts from the workflow run
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: ${{ github.event.workflow_run.id }},
            });

            const coverageArtifact = artifacts.data.artifacts.find(
              artifact => artifact.name === 'coverage'
            );

            if (!coverageArtifact) {
              console.log('No coverage artifact found');
              core.setOutput('has_coverage', 'false');
              return;
            }

            // Download the artifact
            const download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: coverageArtifact.id,
              archive_format: 'zip',
            });

            fs.writeFileSync('coverage.zip', Buffer.from(download.data));
            core.setOutput('has_coverage', 'true');

      - name: Extract coverage data
        if: steps.download.outputs.has_coverage == 'true'
        run: |
          unzip coverage.zip -d coverage-data || true
          if [ -f coverage-data/pr-number.json ]; then
            echo "PR_NUMBER=$(cat coverage-data/pr-number.json)" >> $GITHUB_ENV
          fi

      - name: Compute coverage percentage
        if: env.PR_NUMBER != ''
        id: compute
        run: |
          if [ -f coverage-data/coverage.json ]; then
            # Parse coverage from the JSON file
            COVERAGE=$(node -e "
              const fs = require('fs');
              const coverage = JSON.parse(fs.readFileSync('coverage-data/coverage.json', 'utf8'));
              let totalStatements = 0;
              let coveredStatements = 0;
              for (const file of Object.values(coverage)) {
                if (file.s) {
                  for (const [key, count] of Object.entries(file.s)) {
                    totalStatements++;
                    if (count > 0) coveredStatements++;
                  }
                }
              }
              if (totalStatements > 0) {
                console.log((coveredStatements / totalStatements * 100).toFixed(2) + '%');
              } else {
                console.log('N/A');
              }
            ")
            echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
          else
            echo "coverage=No coverage data available" >> $GITHUB_OUTPUT
          fi

      - name: Report coverage on PR
        if: env.PR_NUMBER != ''
        uses: actions/github-script@v7
        with:
          script: |
            const coverage = '${{ steps.compute.outputs.coverage }}';
            const prNumber = parseInt('${{ env.PR_NUMBER }}', 10);

            if (!prNumber || isNaN(prNumber)) {
              console.log('No valid PR number found');
              return;
            }

            const message = `📊 **Code Coverage Report**\n\nTotal coverage: ${coverage}`;

            // Find existing comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.data.find(
              comment => comment.user.type === 'Bot' && comment.body.includes('Code Coverage Report')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: message,
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: message,
              });
            }
